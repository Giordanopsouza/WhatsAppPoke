[project]
name = "wpp-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "altair>=5.5.0",
    "asyncpg>=0.31.0",
    "composio>=0.19.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "logfire[fastapi,httpx,requests,sqlalchemy]>=4.40.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[openrouter,logfire]>=2.25.0",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.66.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "streamlit>=1.42.0",
    "twilio>=9.10.9",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
